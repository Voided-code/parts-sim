# Builds and tests the desktop app natively on macOS, Windows and Linux.
# Installers are attached to each run as artifacts (and to the release for v* tags, with the
# release's checksums).
name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths-ignore: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

# read-only by default; only the release job (v* tags) may write to the repository's releases
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, dist: 'dist:mac' }
          - { name: Windows, os: windows-latest, dist: 'dist:win' }
          - { name: Linux, os: ubuntu-latest, dist: 'dist:linux' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Package
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Desktop end-to-end test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:desktop
      - name: Desktop end-to-end test
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Upload end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots-${{ matrix.name }}
          if-no-files-found: ignore
          path: test-artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: parts-sim-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe
            release/*-win.zip
            release/*.AppImage
            release/*.tar.gz
  # v* tags: attach the installers to the tag's release (created if it does not exist yet)
  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: parts-sim-*
          path: dist
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Parts Sim ${TAG#v}" --notes "" || true
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-checksums.yml
