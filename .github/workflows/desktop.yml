# Builds and tests the desktop app natively on macOS, Windows and Linux.
# Installers are attached to each run as artifacts (and to the release for v* tags).
name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, dist: 'dist:mac' }
          - { name: Windows, os: windows-latest, dist: 'dist:win' }
          - { name: Linux, os: ubuntu-latest, dist: 'dist:linux' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Package
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Desktop end-to-end test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:desktop
      - name: Desktop end-to-end test
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: parts-sim-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe
            release/*-win.zip
            release/*.AppImage
            release/*.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe
            release/*-win.zip
            release/*.AppImage
            release/*.tar.gz
