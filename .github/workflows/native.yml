# Native C++ app (native/): builds, tests and packages it for Windows and Linux.
# Windows: a portable .zip and an installer (.exe). Linux: an AppImage.
# OpenCascade 7.9 is built from source once per system and cached; Qt comes from the Qt
# installer (aqtinstall), wgpu-native from its GitHub release.
name: Native app

on:
  push:
    branches: [main]
    paths: ['native/**', 'build/icon.*', 'LICENSE', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  OCCT_TAG: V7_9_3
  WGPU_VERSION: v29.0.1.1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            wgpu: wgpu-windows-x86_64-msvc-release.zip
          - name: linux-x64
            os: ubuntu-24.04
            wgpu: wgpu-linux-x86_64-release.zip
    env:
      OCCT_DIR: ${{ github.workspace }}/../occt
      WGPU_NATIVE_DIR: ${{ github.workspace }}/../wgpu
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libvulkan-dev libx11-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libfontconfig1

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows
          "ZLIB_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: wgpu-native
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/gfx-rs/wgpu-native/releases/download/$env:WGPU_VERSION/${{ matrix.wgpu }}" -OutFile wgpu.zip
          Expand-Archive wgpu.zip -DestinationPath $env:WGPU_NATIVE_DIR -Force

      - name: Cache OpenCascade
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OCCT_DIR }}
          key: occt-${{ matrix.name }}-${{ env.OCCT_TAG }}-v1

      # The STEP and IGES readers (TKDESTEP, TKDEIGES) need the application-framework and part of
      # the visualization toolkits (for colours and names); OpenGL, FreeType, Tcl/Tk and Draw are left out.
      - name: Build OpenCascade
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:OCCT_TAG https://github.com/Open-Cascade-SAS/OCCT.git ../occt-src
          cmake -S ../occt-src -B ../occt-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DINSTALL_DIR="$env:OCCT_DIR" -DINSTALL_DIR_LAYOUT=Unix -DBUILD_LIBRARY_TYPE=Shared `
            -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_Visualization=ON -DBUILD_MODULE_ApplicationFramework=ON `
            -DBUILD_MODULE_DataExchange=ON -DBUILD_MODULE_ModelingAlgorithms=ON -DBUILD_MODULE_ModelingData=ON `
            -DUSE_FREETYPE=OFF -DUSE_OPENGL=OFF -DUSE_GLES2=OFF -DUSE_D3D=OFF -DUSE_TK=OFF -DUSE_XLIB=OFF `
            -DUSE_FREEIMAGE=OFF -DUSE_TBB=OFF -DUSE_VTK=OFF -DUSE_RAPIDJSON=OFF -DUSE_DRACO=OFF `
            -DBUILD_DOC_Overview=OFF -DBUILD_SAMPLES_QT=OFF -DINSTALL_SAMPLES=OFF -DINSTALL_TEST_CASES=OFF
          cmake --build ../occt-build
          cmake --install ../occt-build

      - name: Configure
        shell: pwsh
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:OCCT_DIR" -DWGPU_NATIVE_DIR="$env:WGPU_NATIVE_DIR" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build
        run: cmake --build build

      - name: Test
        shell: pwsh
        env:
          PARTS_SIM_NO_GPU: '1'
        run: |
          if ($IsWindows) {
            $env:PATH = "$env:OCCT_DIR\bin;$env:WGPU_NATIVE_DIR\lib;$env:ZLIB_ROOT\bin;$env:PATH"
          } else {
            $env:LD_LIBRARY_PATH = "$env:OCCT_DIR/lib:$env:WGPU_NATIVE_DIR/lib"
          }
          ctest --test-dir build --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") { $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH" }
            else { choco install nsis -y --no-progress; $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH" }
          }
          cd build
          cpack -G "ZIP;NSIS"
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item Parts-Sim-*.zip, Parts-Sim-*.exe ../dist/

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          LD_LIBRARY_PATH: ${{ env.OCCT_DIR }}/lib:${{ env.WGPU_NATIVE_DIR }}/lib
          VERSION: '0.3.0'
        run: |
          cmake --install build --prefix AppDir/usr
          curl -sLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/parts-sim.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/parts-sim.svg \
            --output appimage
          mkdir -p dist
          mv Parts_Sim-*.AppImage "dist/Parts-Sim-$VERSION-native-Linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: parts-sim-native-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
