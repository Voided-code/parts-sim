# Native C++ app (native/): builds, tests and packages it for Windows and Linux.
# Windows: a portable .zip and an installer (.exe). Linux: an AppImage. For v* tags the packages
# go to the release, with the release's checksums (the macOS app is built and attached by hand).
# OpenCascade 7.9 is built from source once per system and cached; Qt comes from the Qt
# installer (aqtinstall), wgpu-native from its GitHub release.
name: Native app

on:
  push:
    branches: [main]
    tags: ['v*'] # (path filters do not apply to tags)
    paths: ['native/**', 'build/icon.*', 'LICENSE', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      compiler:
        description: C++ compiler (system = MSVC on Windows and GCC on Linux, only to compare; the CPU solvers are tuned for clang)
        type: choice
        options: [clang, system]
        default: clang
      only:
        description: Build only this system (windows = the benchmark kit's native build)
        type: choice
        options: [all, windows]
        default: all

# read-only by default; only the release job (v* tags) may write to the repository's releases
permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  OCCT_TAG: V7_9_3
  WGPU_VERSION: v29.0.1.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-2022' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.only == 'windows' && '["windows-x64"]' || '["windows-x64", "linux-x64"]') }}
    env:
      OCCT_DIR: ${{ github.workspace }}/.native-deps/occt
      WGPU_NATIVE_DIR: ${{ github.workspace }}/.native-deps/wgpu
      WGPU_ZIP: ${{ matrix.target == 'windows-x64' && 'wgpu-windows-x86_64-msvc-release.zip' || 'wgpu-linux-x86_64-release.zip' }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libvulkan-dev libx11-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libfontconfig1 xvfb

      # the x64 build tools' environment (what vcvars64.bat sets) for the steps after this one
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the C++ tools is not installed.' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64.bat failed.' }

      - name: zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows
          "ZLIB_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: wgpu-native
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/gfx-rs/wgpu-native/releases/download/$env:WGPU_VERSION/$env:WGPU_ZIP" -OutFile wgpu.zip
          Expand-Archive wgpu.zip -DestinationPath $env:WGPU_NATIVE_DIR -Force

      - name: Cache OpenCascade
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.OCCT_DIR }}
          key: occt-${{ matrix.target }}-${{ env.OCCT_TAG }}-minimal-v2

      # Build only the linked toolkits and the dependencies OCCT discovers for them.
      - name: Build OpenCascade
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:OCCT_TAG https://github.com/Open-Cascade-SAS/OCCT.git ../occt-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S ../occt-src -B ../occt-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DINSTALL_DIR="$env:OCCT_DIR" -DINSTALL_DIR_LAYOUT=Unix -DBUILD_LIBRARY_TYPE=Shared `
            -DBUILD_MODULE_FoundationClasses=OFF -DBUILD_MODULE_ModelingData=OFF -DBUILD_MODULE_ModelingAlgorithms=OFF `
            -DBUILD_MODULE_Visualization=OFF -DBUILD_MODULE_ApplicationFramework=OFF -DBUILD_MODULE_DataExchange=OFF `
            -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_DETools=OFF `
            "-DBUILD_ADDITIONAL_TOOLKITS=TKernel TKMath TKBRep TKG2d TKG3d TKGeomBase TKGeomAlgo TKTopAlgo TKPrim TKBO TKOffset TKFillet TKShHealing TKMesh TKXSBase TKDESTEP TKDEIGES" `
            -DBUILD_USE_PCH=ON `
            -DUSE_FREETYPE=OFF -DUSE_OPENGL=OFF -DUSE_GLES2=OFF -DUSE_D3D=OFF -DUSE_TK=OFF -DUSE_XLIB=OFF `
            -DUSE_FREEIMAGE=OFF -DUSE_TBB=OFF -DUSE_VTK=OFF -DUSE_RAPIDJSON=OFF -DUSE_DRACO=OFF `
            -DBUILD_DOC_Overview=OFF -DBUILD_SAMPLES_QT=OFF -DINSTALL_SAMPLES=OFF -DINSTALL_TEST_CASES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ../occt-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install ../occt-build

      # Save immediately: a later app or packaging failure must not discard this costly build.
      - name: Save OpenCascade
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.OCCT_DIR }}
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}

      # Both build with clang, which ships with the runner images and links against the MSVC- and
      # GCC-built Qt and OpenCascade: MSVC ignores the CPU solvers' vector types and loop hints, and
      # GCC's code for them is several times slower.
      - name: Configure
        shell: pwsh
        run: |
          $compiler = @()
          if ('${{ inputs.compiler }}' -ne 'system') {
            $compiler = if ($IsWindows) { '-DCMAKE_C_COMPILER=clang-cl', '-DCMAKE_CXX_COMPILER=clang-cl' } else { '-DCMAKE_C_COMPILER=clang', '-DCMAKE_CXX_COMPILER=clang++' }
          }
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release @compiler `
            -DCMAKE_PREFIX_PATH="$env:OCCT_DIR" -DWGPU_NATIVE_DIR="$env:WGPU_NATIVE_DIR" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build
        run: cmake --build build

      - name: Test
        shell: pwsh
        env:
          PARTS_SIM_NO_GPU: '1'
        run: |
          if ($IsWindows) {
            $env:PATH = "$env:OCCT_DIR\bin;$env:WGPU_NATIVE_DIR\lib;$env:ZLIB_ROOT\bin;$env:PATH"
          } else {
            $env:LD_LIBRARY_PATH = "$env:OCCT_DIR/lib:$env:WGPU_NATIVE_DIR/lib"
          }
          ctest --test-dir build --output-on-failure

      - name: Benchmark (CPU engines)
        continue-on-error: true
        shell: pwsh
        env:
          PARTS_SIM_NO_GPU: '1'
        run: |
          if ($IsWindows) {
            $env:PATH = "$env:OCCT_DIR\bin;$env:WGPU_NATIVE_DIR\lib;$env:ZLIB_ROOT\bin;$env:PATH"
          } else {
            $env:LD_LIBRARY_PATH = "$env:OCCT_DIR/lib:$env:WGPU_NATIVE_DIR/lib"
          }
          ./build/bench

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") { $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH" }
            else { choco install nsis -y --no-progress; $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH" }
          }
          cd build
          cpack -G "ZIP;NSIS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item Parts-Sim-*.zip, Parts-Sim-*.exe ../dist/

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib:${{ env.OCCT_DIR }}/lib:${{ env.WGPU_NATIVE_DIR }}/lib
        run: |
          # the version comes from native/CMakeLists.txt (linuxdeploy also stamps it into the AppImage)
          export VERSION=$(sed -n 's/^project(PartsSim VERSION \([0-9.]*\).*/\1/p' native/CMakeLists.txt)
          test -n "$VERSION"
          cmake --install build --prefix AppDir/usr
          curl -fLsSO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fLsSO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/parts-sim.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/parts-sim.svg \
            --output appimage
          mkdir -p dist
          mv Parts_Sim-*.AppImage "dist/Parts-Sim-$VERSION-native-Linux-x86_64.AppImage"

      - name: Test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/Parts-Sim-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath package-test
          $app = Get-ChildItem package-test -Recurse -Filter 'Parts Sim.exe' | Select-Object -First 1
          if (-not $app) { throw 'The package contains no desktop executable.' }
          python native/tests/smoke_app.py $app.FullName --isolated --screenshot package-smoke.png

      # the installer registers .psim (open with Parts Sim) and the uninstaller removes it again; the installed app opens a .psim file
      - name: Test the installer and the .psim file association (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/Parts-Sim-*.exe | Select-Object -First 1
          $dir = 'C:\psim-assoc'
          Start-Process $installer.FullName -ArgumentList '/S', "/D=$dir" -Wait
          $roots = 'HKLM:\Software\Classes', 'HKCU:\Software\Classes'
          $found = $roots | Where-Object { Test-Path "$_\.psim" } | Select-Object -First 1
          if (-not $found) { throw 'The installer did not register the .psim file type.' }
          "found in $found"
          if ((Get-ItemProperty "$found\.psim").'(default)' -ne 'PartsSim.psim') { throw '.psim does not point to the Parts Sim file class.' }
          $command = (Get-ItemProperty "$found\PartsSim.psim\shell\open\command").'(default)'
          "open command: $command"
          reg query "HKLM\Software\Classes\PartsSim.psim\shell\open\command"
          if ($command -notmatch 'Parts Sim\.exe') { throw 'The open command does not start Parts Sim.' }
          $exe = Get-ChildItem $dir -Recurse -Filter 'Parts Sim.exe' | Select-Object -First 1
          if (-not $exe) { throw 'The installer put no Parts Sim.exe in the folder.' }
          # the installed app opens a file written by the JavaScript code (assert:psim exits with an error when no results show)
          $env:PARTS_SIM_NO_GPU = '1'
          $env:PARTS_SIM_SCRIPT = "open:$((Resolve-Path test/fixtures/psim/v1-tube-stride.psim).Path);idle;assert:psim;quit"
          $p = Start-Process $exe.FullName -Wait -PassThru
          Remove-Item Env:PARTS_SIM_SCRIPT
          if ($p.ExitCode -ne 0) { throw "The installed app could not open the .psim file (exit code $($p.ExitCode))." }
          & "$dir\Uninstall.exe" /S "_?=$dir"
          if ($roots | Where-Object { Test-Path "$_\.psim" }) { throw 'The uninstaller left the .psim file type registered.' }
          'the .psim association is registered, works and is removed again'

      - name: Check the .psim file type files (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f AppDir/usr/share/mime/packages/parts-sim-psim.xml
          grep -q 'application/x-parts-sim' AppDir/usr/share/mime/packages/parts-sim-psim.xml
          grep -q 'application/x-parts-sim' AppDir/usr/share/applications/parts-sim.desktop
          echo 'the shared-mime-info file and the desktop entry name the .psim type'

      - name: Test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 native/tests/smoke_app.py dist/Parts-Sim-*.AppImage --isolated --screenshot package-smoke.png

      - uses: actions/upload-artifact@v7
        with:
          name: parts-sim-native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # the benchmark kit runs bench.exe from the unpacked portable package (which has its DLLs)
      - name: Upload benchmark (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: parts-sim-bench-${{ matrix.target }}
          path: build/bench.exe
          if-no-files-found: error

      - name: Upload packaged-app screenshot
        if: always() && hashFiles('package-smoke.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: parts-sim-native-${{ matrix.target }}-smoke
          path: package-smoke.png

  # v* tags: attach the packages to the tag's release (created if it does not exist yet)
  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: parts-sim-native-*-x64
          path: dist
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Parts Sim ${TAG#v}" --notes "" || true
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-checksums.yml
